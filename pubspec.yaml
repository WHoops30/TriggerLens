name: trigger_lens
description: "TriggerLens Local Database"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.6
  camera: ^0.10.5+5
  google_mlkit_text_recognition: ^0.17.1
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  google_generative_ai: ^0.4.7
  firebase_auth: ^6.6.0
  intl: ^0.20.3
  google_sign_in: 6.2.1
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  csv: ^8.0.0
  share_plus: ^13.3.0
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  image_cropper: ^12.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  isar_generator: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/triggerlens_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAFAFA"
  image: "assets/images/triggerlens_icon.png"
  android_12:
    image: "assets/images/triggerlens_icon.png"
    color: "#FAFAFA"
